<script>
document.addEventListener("DOMContentLoaded", () => {

  // Data do início do namoro
  const startDate = new Date("2023-04-12T00:00:00");
  const today = new Date();

  // Zera horas (evita erro de fuso)
  startDate.setHours(0,0,0,0);
  today.setHours(0,0,0,0);

  // Diferença em dias (ajuste Google)
  const diffTime = today.getTime() - startDate.getTime();
  const daysTogether = Math.floor(diffTime / (1000 * 60 * 60 * 24)) - 5;

  // Elementos
  const counter = document.getElementById("days-count");
  const text = document.getElementById("days");

  // Proteção
  if (!counter) return;

  // 🔥 Animação suave
  let current = 0;
  const speed = Math.max(1, Math.floor(daysTogether / 80));

  const interval = setInterval(() => {
    current += speed;
    if (current >= daysTogether) {
      current = daysTogether;
      clearInterval(interval);
    }
    counter.innerText = current;
  }, 20);

  if (text) {
    text.innerText = " dias felizes ao seu lado ";
  }

});
</script>

<!-- Script do movimento do personagem removido para evitar efeito estranho no hover -->
<script>
  (() => {
    const player = document.querySelector('.music-player');
    if (!player) return;

    const audio = player.querySelector('#music-player-audio');
    const cover = player.querySelector('.music-player-cover');
    const title = player.querySelector('.music-player-title');
    const artist = player.querySelector('.music-player-artist');
    const progress = player.querySelector('#music-player-progress');
    const btnPlay = player.querySelector('.music-player-play');
    const btnPrev = player.querySelector('.music-player-prev');
    const btnNext = player.querySelector('.music-player-next');

    const tracks = [
      { title: 'TENEBROSA', artist: 'MC LIVINHO', src: 'img/video1.mp4', cover: 'img/musica.png' },
      { title: 'NOSSA MUSICA ', artist: 'BRUNO MARS', src: 'img/video2.mp4', cover: 'img/hero2.jpg' },
      { title: 'FOI ASSIM', artist: 'SOTAM', src: 'img/video3.mp4', cover: 'img/story2.jpg' }
    ];

    let currentTrackIndex = 0;
    let isDragging = false;

    function setPlayButton(isPlaying) {
      btnPlay.textContent = isPlaying ? '⏸' : '▷';
    }

    function loadTrack(index, shouldAutoplay = false) {
      if (!tracks.length) return;

      const safeIndex = (index + tracks.length) % tracks.length;
      const track = tracks[safeIndex];
      currentTrackIndex = safeIndex;

      audio.src = track.src;
      audio.load();

      title.textContent = track.title;
      artist.textContent = track.artist;
      cover.src = track.cover;
      cover.alt = `Capa de ${track.title}`;
      progress.value = 0;

      if (shouldAutoplay) {
        audio.play().then(() => setPlayButton(true)).catch(() => setPlayButton(false));
      } else {
        setPlayButton(false);
      }
    }

    function togglePlayPause() {
      if (!audio.src) return;

      if (audio.paused) {
        audio.play().then(() => setPlayButton(true)).catch(() => setPlayButton(false));
      } else {
        audio.pause();
        setPlayButton(false);
      }
    }

    btnPlay.addEventListener('click', togglePlayPause);
    btnPrev.addEventListener('click', () => loadTrack(currentTrackIndex - 1, true));
    btnNext.addEventListener('click', () => loadTrack(currentTrackIndex + 1, true));

    audio.addEventListener('play', () => setPlayButton(true));
    audio.addEventListener('pause', () => setPlayButton(false));
    audio.addEventListener('ended', () => loadTrack(currentTrackIndex + 1, true));

    audio.addEventListener('timeupdate', () => {
      if (isDragging || !audio.duration) return;
      progress.value = Math.round((audio.currentTime / audio.duration) * 100);
    });

    progress.addEventListener('input', () => {
      isDragging = true;
    });

    progress.addEventListener('change', () => {
      if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
      }
      isDragging = false;
    });

    loadTrack(0);
  })();
</script>
